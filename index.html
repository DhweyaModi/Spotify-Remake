<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nugget's Playlist · Spotify</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="12" fill="#1ed760" />
            <path d="M5.2 8.6c4.4-1.3 9.4-.9 13.5 1.5" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" />
            <path d="M6 12.2c3.7-1 7.7-.7 11 1.2" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" />
            <path d="M6.8 15.5c3-.8 6-.5 8.6.9" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <span class="wordmark">Spotify</span>
        </div>
        <p class="eyebrow">Playlist</p>
        <h1>Nugget's Playlist</h1>
        <p class="tagline">A mini music app that is about to get a memory.</p>
      </header>

      <p id="status" role="status"></p>
      <ul id="song-list"></ul>

      <details class="add" open>
        <summary>Add a song</summary>
        <form id="add-form">
          <input name="title" placeholder="Title" required />
          <input name="artist" placeholder="Artist" required />
          <input name="album" placeholder="Album (optional)" />
          <button type="submit">Add</button>
        </form>
      </details>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
